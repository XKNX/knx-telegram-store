name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,sqlite,postgres]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check formatting with Ruff
        run: |
          ruff format --check .

      - name: Type check with Mypy
        run: |
          mypy src/knx_telegram_store

      - name: Run Tests with Pytest
        run: |
          export PYTHONPATH=src
          python -m pytest tests/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: knx
          POSTGRES_PASSWORD: knxtest
          POSTGRES_DB: knx
        options: >-
          --health-cmd "pg_isready -U knx -d knx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17-alpine
        ports:
          - 5434:5432
        env:
          POSTGRES_USER: knx
          POSTGRES_PASSWORD: knxtest
          POSTGRES_DB: knx
        options: >-
          --health-cmd "pg_isready -U knx -d knx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,postgres]

      - name: Run integration tests
        env:
          KNX_TEST_TIMESCALE_DSN: postgresql://knx:knxtest@localhost:5433/knx
          KNX_TEST_PG_DSN: postgresql://knx:knxtest@localhost:5434/knx
        run: |
          export PYTHONPATH=src
          python -m pytest -m integration tests/integration -v
